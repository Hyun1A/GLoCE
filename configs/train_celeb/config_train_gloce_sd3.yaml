logging:
  generate_num: 1
  interval: 1800
  project_name: erase_celeb
  prompts:
  - Emma Stone
  - A_portrait_of_Emma_Stone
  - chris evans
  - chris hemsworth
  - chuck norris
  - captain america
  - andrew garfield
  - Dakota Johnson
  - An_oil_painting_of_Chris_Evans
  - A_portrait_of_Chris_Evans
  - An_image_capturing_Chris_Evans_at_a_public_event
  - A_sketch_of_Chris_Evans
  - chris evans is giving a speech in Congress wearing a blue outfit.
  - Mario embarked on an adventure to save the princess in the kingdom.
  run_name: erase
  seed: 0
  use_wandb: false
  verbose: false
  stage_interval: 6
network:
  alpha: 1.0
  num_embeddings: 77
  continual_rank: 8
  hidden_size: 8
  init_size: 8
  rank: 4
other:
  use_xformers: true
pretrained_model:
  clip_skip: 1
  name_or_path: stabilityai/stable-diffusion-3-medium-diffusers
  safetensor: []
  v2: false
  v_pred: false

prompts_file_target: configs/train_celeb/prompt_train_gloce_sd3_target.yaml
prompts_file_anchor: configs/train_celeb/prompt_train_gloce_sd3_anchor.yaml
prompts_file_update: configs/train_celeb/prompt_train_gloce_sd3_update.yaml


replace_word: celeb
save:
  name: erase_celeb
  path: "output/Singleton_Celeb/celeb_50/nice_output_barack_obama"
  per_steps: 1000
  precision: float32
  stage_interval: 1
scripts_file: configs/train_celeb/prompt_templates.csv
train:
  batch_size: 1
  iterations: 450
  lr: 0.00003
  lr_scheduler: cosine_with_restarts
  lr_scheduler_num_cycles: 1
  lr_warmup_steps: 5
  max_denoising_steps: 50
  noise_scheduler: ddim
  optimizer_type: AdamW8bit
  pal: 1e+5
  portion: 0.05
  precision: float32
  text_encoder_lr: 1e-05
  unet_lr: 0.0001
  value_weight: 0.1
  
  train_seed: 2024
  
  do_adv_learn: True
  num_stages: 5
  iterations_adv: 450
  
  lr_adv: 0.01
  lr_scheduler_adv: cosine_with_restarts
  lr_scheduler_num_cycles_adv: 1
  lr_warmup_steps_adv: 5
  num_add_prompts: 16
  adv_coef: 1.0
  
  factor_init_iter: 4
  factor_init_lr: 10
  factor_init_lr_cycle: 2
  
  # st_prompt_idx: 45
  # end_prompt_idx: 46

  resume_stage: 0